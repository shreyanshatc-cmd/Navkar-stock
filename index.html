<!doctype html>
<!--
PIN AUTHENTICATION SETUP:
Enable Firebase Authentication -> Sign-in method -> Email/Password.
Create ONE Firebase Authentication user:
Email: navkar.atc@gmail.com
Password: choose your PIN (for example 2580 initially).
The PIN is sent directly to Firebase Authentication; it is NOT stored in this HTML file.
After creating the user, this screen accepts that PIN.

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f">
<title>Navkar Stock</title>
<style>
:root{--nav:#173f5f;--ink:#18212b;--muted:#718096;--bg:#f6f8fa;--card:#fff;--line:#e2e8f0;--ok:#16834a;--bad:#b42318;--warn:#a15c00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Roboto,Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0002}
header h1{margin:0;font-size:22px}
header .user{font-size:12px;opacity:.85;margin-right:10px}
#app{max-width:1000px;margin:auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
h2,h3{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:13px;color:#596575;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus{border-color:var(--nav);box-shadow:0 0 0 3px #173f5f18}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}
.primary{background:var(--nav);color:#fff}
.secondary{background:#edf2f7;color:var(--nav)}
.danger{background:#fee4e2;color:var(--bad)}
.success{background:#dcfae8;color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;position:sticky;top:61px;background:var(--bg);z-index:10}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;color:#52606d}
.tab.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.hidden{display:none!important}
.small{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:650px){.kpis{grid-template-columns:1fr}}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.kpi b{font-size:24px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:#596575;background:#f8fafc}
.tablewrap{overflow:auto}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#edf2f7}
.badge.ok{background:#dcfae8;color:var(--ok)}
.badge.bad{background:#fee4e2;color:var(--bad)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{max-width:430px;width:100%;text-align:center}
.logo{width:80px;height:80px;border-radius:22px;background:var(--nav);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:800;margin:0 auto 20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#18212b;color:#fff;padding:12px 16px;border-radius:10px;z-index:100;max-width:90%;box-shadow:0 5px 20px #0004}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:50}
.modalbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.iconbtn{border:0;background:transparent;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:5px;padding:8px;z-index:20}
nav button{border:0;background:transparent;padding:8px 13px;border-radius:10px;color:#667085;font-weight:700}
nav button.active{color:var(--nav);background:#eef5fa}
.empty{padding:25px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card loginbox">
    <div class="logo">N</div>
    <h1>Navkar Stock</h1>
    <p class="small">Enter your company PIN to continue</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="12"
           placeholder="Enter PIN" autocomplete="current-password"
           style="text-align:center;font-size:22px;letter-spacing:5px;margin-top:14px">
    <button id="pinBtn" class="btn primary" style="width:100%;margin-top:12px">Login</button>
    <p id="loginMsg" class="small" style="margin-top:12px"></p>
  </div>
</div>

<div id="shell" class="hidden">
<header>
  <div><h1>Navkar Stock</h1><span id="sync" class="small" style="color:#fff"></span></div>
  <div class="row"><span id="who" class="user"></span><button id="logout" class="btn secondary">Logout</button></div>
</header>

<div id="app">
  <div class="tabs">
    <button class="tab active" data-page="home">Home</button>
    <button class="tab" data-page="entry">Entry</button>
    <button class="tab" data-page="items">Items</button>
    <button class="tab" data-page="godowns">Godowns</button>
    <button class="tab" data-page="history">History</button>
    <button class="tab" data-page="reports">Reports</button>
  </div>

  <section id="home" class="page">
    <div class="card"><div class="spread"><div><h2>Dashboard</h2><div class="small">Live Firebase data</div></div><button class="btn secondary" id="refresh">Refresh</button></div></div>
    <div class="kpis">
      <div class="kpi"><span class="small">Items</span><b id="kItems">0</b></div>
      <div class="kpi"><span class="small">Godowns</span><b id="kGodowns">0</b></div>
      <div class="kpi"><span class="small">Stock KG</span><b id="kStock">0</b></div>
    </div>
    <div class="card"><h3>Low / Negative Stock</h3><div id="lowStock"></div></div>
  </section>

  <section id="entry" class="page hidden">
    <div class="card"><h2>Stock Entry</h2>
      <div class="grid">
        <div><label>Type</label><select id="mType"><option value="IN">Stock In</option><option value="OUT">Stock Out</option><option value="TRANSFER">Godown Transfer</option></select></div>
        <div><label>Date</label><input id="mDate" type="date"></div>
        <div><label>Item</label><select id="mItem"></select></div>
        <div><label>Quantity KG</label><input id="mQty" type="number" min="0.001" step="0.001"></div>
        <div><label>From Godown</label><select id="mFrom"></select></div>
        <div><label>To Godown</label><select id="mTo"></select></div>
        <div><label>Party / Reference</label><input id="mParty" placeholder="Optional"></div>
        <div><label>Note</label><input id="mNote" placeholder="Optional"></div>
      </div>
      <div class="row" style="margin-top:14px"><button id="saveMovement" class="btn primary">Save Movement</button><span id="entryHint" class="small"></span></div>
    </div>
  </section>

  <section id="items" class="page hidden">
    <div class="card"><div class="spread"><h2>Items</h2><button class="btn primary" id="newItem">+ New Item</button></div>
      <input id="itemSearch" placeholder="Search item..." style="margin-bottom:12px">
      <div class="tablewrap"><table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Unit</th><th>Actions</th></tr></thead><tbody id="itemsBody"></tbody></table></div>
    </div>
  </section>

  <section id="godowns" class="page hidden">
    <div class="card"><div class="spread"><h2>Godowns</h2><button class="btn primary" id="newGodown">+ New Godown</button></div>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>Active</th><th>Actions</th></tr></thead><tbody id="godownsBody"></tbody></table></div>
    </div>
  </section>

  <section id="history" class="page hidden">
    <div class="card"><div class="spread"><h2>History</h2><input id="histSearch" style="max-width:260px" placeholder="Search"></div>
      <div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Item</th><th>Qty</th><th>Godown</th><th>User</th><th>Action</th></tr></thead><tbody id="historyBody"></tbody></table></div>
    </div>
  </section>

  <section id="reports" class="page hidden">
    <div class="card"><div class="spread"><h2>Current Stock</h2><button class="btn secondary" id="csvBtn">Export CSV</button></div>
      <div class="tablewrap"><table><thead><tr><th>Item</th><th>Godown</th><th>Stock KG</th></tr></thead><tbody id="stockBody"></tbody></table></div>
    </div>
  </section>
</div>
<nav>
  <button data-page="home" class="active">Home</button>
  <button data-page="entry">Entry</button>
  <button data-page="items">Items</button>
  <button data-page="godowns">Godowns</button>
  <button data-page="history">History</button>
  <button data-page="reports">Reports</button>
</nav>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="spread"><h3 id="modalTitle"></h3><button class="iconbtn" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcodQI2IvGvYEI5wm2TPgQbZqicStLvQA",
  authDomain: "navkar-stock.firebaseapp.com",
  projectId: "navkar-stock",
  storageBucket: "navkar-stock.firebasestorage.app",
  messagingSenderId: "46124992179",
  appId: "1:46124992179:web:8fb935187310e9fcf552c6",
  measurementId: "G-TTCX6E5E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let user=null, items=[], godowns=[], movements=[], unsub=[];
const $=id=>document.getElementById(id);
const toast=(m)=>{ $("toast").textContent=m; $("toast").classList.remove("hidden"); setTimeout(()=>$("toast").classList.add("hidden"),3000); };
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);

$("mDate").value=today();

const NAVKAR_LOGIN_EMAIL = "navkar.atc@gmail.com";
$("pinBtn").onclick=loginWithPin;
$("pinInput").addEventListener("keydown", e=>{ if(e.key==="Enter") loginWithPin(); });

async function loginWithPin(){
  const pin=$("pinInput").value.trim();
  if(!pin){ $("loginMsg").textContent="Enter your PIN."; return; }
  $("pinBtn").disabled=true; $("pinBtn").textContent="Checking...";
  $("loginMsg").textContent="";
  try{
    await signInWithEmailAndPassword(auth,NAVKAR_LOGIN_EMAIL,pin);
    $("pinInput").value="";
  }catch(e){
    console.error(e);
    $("loginMsg").textContent="Incorrect PIN.";
    $("pinInput").select();
  }finally{
    $("pinBtn").disabled=false; $("pinBtn").textContent="Login";
  }
}
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth, u=>{
  user=u;
  if(u){ $("login").classList.add("hidden"); $("shell").classList.remove("hidden"); $("who").textContent=u.displayName||u.email||""; startListeners(); }
  else { $("shell").classList.add("hidden"); $("login").classList.remove("hidden"); stopListeners(); }
});

function startListeners(){
  stopListeners();
  const listen=(col,cb,ord)=>{
    let q=ord?query(collection(db,col),orderBy(ord,"desc")):collection(db,col);
    return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()}))); $("sync").textContent=" • Live";},e=>{console.error(e); $("sync").textContent=" • Sync error";});
  };
  unsub=[
    listen("items",x=>{items=x; renderAll()}),
    listen("godowns",x=>{godowns=x; renderAll()}),
    listen("movements",x=>{movements=x; renderAll()},"createdAt")
  ];
}
function stopListeners(){unsub.forEach(f=>f&&f());unsub=[]}

function renderAll(){
  renderSelects(); renderItems(); renderGodowns(); renderHistory(); renderStock(); renderDashboard();
}
function renderSelects(){
  const active=godowns.filter(g=>g.active!==false);
  const optItems=items.map(i=>`<option value="${esc(i.id)}">${esc(i.itemCode||"")} — ${esc(i.itemName||"")}</option>`).join("");
  const optGod=active.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("");
  $("mItem").innerHTML=optItems;
  $("mFrom").innerHTML=optGod;
  $("mTo").innerHTML=optGod;
}
function renderItems(){
  const term=$("itemSearch").value.toLowerCase();
  const rows=items.filter(i=>(i.itemName+" "+i.itemCode+" "+i.category).toLowerCase().includes(term));
  $("itemsBody").innerHTML=rows.length?rows.map(i=>`<tr><td>${esc(i.itemCode)}</td><td><b>${esc(i.itemName)}</b></td><td>${esc(i.category||"")}</td><td>${esc(i.unit||"KG")}</td><td><button class="btn secondary" onclick="editItem('${i.id}')">Edit</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">No items</td></tr>`;
}
function renderGodowns(){
  $("godownsBody").innerHTML=godowns.length?godowns.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.active===false?'<span class="badge bad">Inactive</span>':'<span class="badge ok">Active</span>'}</td><td><button class="btn secondary" onclick="editGodown('${g.id}')">Edit</button></td></tr>`).join(""):`<tr><td colspan="3" class="empty">No godowns</td></tr>`;
}
function renderHistory(){
  const term=$("histSearch").value.toLowerCase();
  const rows=movements.filter(m=>(m.itemName+" "+m.party+" "+m.type+" "+m.fromName+" "+m.toName).toLowerCase().includes(term)).slice(0,200);
  $("historyBody").innerHTML=rows.length?rows.map(m=>{
    const qty=Number(m.qty||0).toFixed(3);
    const place=m.type==="TRANSFER"?`${esc(m.fromName||"")} → ${esc(m.toName||"")}`:esc(m.type==="IN"?m.toName||"":m.fromName||"");
    return `<tr><td>${esc(m.date||"")}</td><td><span class="badge">${esc(m.type)}</span></td><td>${esc(m.itemName||m.itemId)}</td><td>${qty}</td><td>${place}</td><td>${esc(m.userEmail||"")}</td><td><button class="btn secondary" onclick="editMovement('${m.id}')">Edit</button></td></tr>`;
  }).join(""):`<tr><td colspan="7" class="empty">No movements</td></tr>`;
}
function stockMap(){
  const map={};
  items.forEach(i=>godowns.forEach(g=>map[i.id+"|"+g.id]={item:i,godown:g,qty:Number(i.openingStock||0)*(godowns.indexOf(g)===0?1:0)}));
  movements.forEach(m=>{
    const q=Number(m.qty||0);
    if(m.type==="IN" && map[m.itemId+"|"+m.toGodownId]) map[m.itemId+"|"+m.toGodownId].qty+=q;
    if(m.type==="OUT" && map[m.itemId+"|"+m.fromGodownId]) map[m.itemId+"|"+m.fromGodownId].qty-=q;
    if(m.type==="TRANSFER"){
      if(map[m.itemId+"|"+m.fromGodownId]) map[m.itemId+"|"+m.fromGodownId].qty-=q;
      if(map[m.itemId+"|"+m.toGodownId]) map[m.itemId+"|"+m.toGodownId].qty+=q;
    }
  });
  return Object.values(map);
}
function renderStock(){
  const rows=stockMap();
  $("stockBody").innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r.item.itemName)}</td><td>${esc(r.godown.name)}</td><td class="${r.qty<0?'bad':''}"><b>${r.qty.toFixed(3)}</b></td></tr>`).join(""):`<tr><td colspan="3" class="empty">No stock</td></tr>`;
}
function renderDashboard(){
  $("kItems").textContent=items.length; $("kGodowns").textContent=godowns.length;
  const total=stockMap().reduce((a,r)=>a+r.qty,0); $("kStock").textContent=total.toFixed(3);
  const low=stockMap().filter(r=>r.qty<=0);
  $("lowStock").innerHTML=low.length?`<div class="tablewrap"><table><tr><th>Item</th><th>Godown</th><th>Stock</th></tr>${low.map(r=>`<tr><td>${esc(r.item.itemName)}</td><td>${esc(r.godown.name)}</td><td><span class="badge bad">${r.qty.toFixed(3)} KG</span></td></tr>`).join("")}</table></div>`:`<div class="empty">No zero/negative stock.</div>`;
}

$("mType").onchange=()=>{const t=$("mType").value; $("mFrom").parentElement.classList.toggle("hidden",t==="IN"); $("mTo").parentElement.classList.toggle("hidden",t==="OUT");};
$("saveMovement").onclick=saveMovement;
async function saveMovement(){
  if(!user)return;
  const type=$("mType").value,item=items.find(i=>i.id===$("mItem").value),qty=Number($("mQty").value);
  if(!item||!qty||qty<=0){toast("Select item and valid quantity.");return}
  const from=godowns.find(g=>g.id===$("mFrom").value),to=godowns.find(g=>g.id===$("mTo").value);
  if(type==="TRANSFER" && (!from||!to||from.id===to.id)){toast("Choose two different godowns.");return}
  if(type==="OUT"||type==="TRANSFER"){
    const source=stockMap().find(r=>r.item.id===item.id&&r.godown.id===(from?.id));
    if(type==="OUT" && (!source||source.qty<qty)){toast("Insufficient stock. Entry blocked.");return}
    if(type==="TRANSFER" && (!source||source.qty<qty)){toast("Insufficient stock in source godown. Transfer blocked.");return}
  }
  const data={type,date:$("mDate").value||today(),itemId:item.id,itemName:item.itemName,itemCode:item.itemCode||"",qty,
    fromGodownId:type==="IN"?null:from?.id||null,fromName:type==="IN"?null:from?.name||null,
    toGodownId:type==="OUT"?null:to?.id||null,toName:type==="OUT"?null:to?.name||null,
    party:$("mParty").value.trim(),note:$("mNote").value.trim(),userUid:user.uid,userEmail:user.email||"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
  try{await addDoc(collection(db,"movements"),data); $("mQty").value="";$("mParty").value="";$("mNote").value="";toast("Movement saved.");}
  catch(e){console.error(e);toast("Could not save: "+e.message)}
}

$("newItem").onclick=()=>openItem();
window.editItem=id=>openItem(items.find(i=>i.id===id));
function openItem(x={}){
  $("modalTitle").textContent=x.id?"Edit Item":"New Item";
  $("modalBody").innerHTML=`<div class="grid">
  <div><label>Item Code</label><input id="fCode" value="${esc(x.itemCode||"")}"></div>
  <div><label>Item Name</label><input id="fName" value="${esc(x.itemName||"")}"></div>
  <div><label>Category</label><input id="fCat" value="${esc(x.category||"")}"></div>
  <div><label>Unit</label><input id="fUnit" value="${esc(x.unit||"KG")}"></div>
  <div><label>Opening Stock KG</label><input id="fOpen" type="number" step="0.001" value="${Number(x.openingStock||0)}"></div>
  </div><div class="row" style="margin-top:14px"><button class="btn primary" id="saveItem">Save Item</button></div>`;
  $("modal").classList.remove("hidden");
  $("saveItem").onclick=async()=>{
    const data={itemCode:$("fCode").value.trim(),itemName:$("fName").value.trim(),category:$("fCat").value.trim(),unit:$("fUnit").value.trim()||"KG",openingStock:Number($("fOpen").value||0),updatedAt:serverTimestamp(),updatedBy:user.email||""};
    if(!data.itemName){toast("Item name required.");return}
    try{if(x.id)await updateDoc(doc(db,"items",x.id),data);else await addDoc(collection(db,"items"),{...data,createdAt:serverTimestamp(),createdBy:user.email||""});closeModal();toast("Item saved.");}catch(e){toast(e.message)}
  };
}
$("newGodown").onclick=()=>openGodown();
window.editGodown=id=>openGodown(godowns.find(g=>g.id===id));
function openGodown(x={}){
  $("modalTitle").textContent=x.id?"Edit Godown":"New Godown";
  $("modalBody").innerHTML=`<label>Godown Name</label><input id="gName" value="${esc(x.name||"")}"><div style="margin-top:10px"><label><input id="gActive" type="checkbox" ${x.active!==false?"checked":""} style="width:auto"> Active</label></div><div class="row" style="margin-top:14px"><button class="btn primary" id="saveGodown">Save Godown</button></div>`;
  $("modal").classList.remove("hidden");
  $("saveGodown").onclick=async()=>{
    const data={name:$("gName").value.trim(),active:$("gActive").checked,updatedAt:serverTimestamp(),updatedBy:user.email||""};
    if(!data.name){toast("Name required.");return}
    try{if(x.id)await updateDoc(doc(db,"godowns",x.id),data);else await addDoc(collection(db,"godowns"),{...data,createdAt:serverTimestamp(),createdBy:user.email||""});closeModal();toast("Godown saved.");}catch(e){toast(e.message)}
  };
}
window.editMovement=id=>openMovement(movements.find(m=>m.id===id));
function openMovement(x){
  if(!x)return;
  $("modalTitle").textContent="Edit Movement";
  $("modalBody").innerHTML=`<div class="small">Editing changes the stored transaction. Stock is recalculated from the movement records.</div><div class="grid" style="margin-top:12px">
  <div><label>Date</label><input id="eDate" type="date" value="${esc(x.date||today())}"></div>
  <div><label>Quantity KG</label><input id="eQty" type="number" step="0.001" min="0.001" value="${Number(x.qty||0)}"></div>
  <div><label>Party / Reference</label><input id="eParty" value="${esc(x.party||"")}"></div>
  <div><label>Note</label><input id="eNote" value="${esc(x.note||"")}"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="saveMovEdit">Save Edit</button></div>`;
  $("modal").classList.remove("hidden");
  $("saveMovEdit").onclick=async()=>{
    const q=Number($("eQty").value); if(!q||q<=0){toast("Invalid quantity.");return}
    try{await updateDoc(doc(db,"movements",x.id),{date:$("eDate").value,qty:q,party:$("eParty").value.trim(),note:$("eNote").value.trim(),updatedAt:serverTimestamp(),updatedBy:user.email||""});await addDoc(collection(db,"auditLogs"),{action:"EDIT_MOVEMENT",movementId:x.id,beforeQty:x.qty,afterQty:q,userUid:user.uid,userEmail:user.email||"",createdAt:serverTimestamp()});closeModal();toast("Movement updated.");}catch(e){toast(e.message)}
  };
}
function closeModal(){$("modal").classList.add("hidden")}
$("closeModal").onclick=closeModal;
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function showPage(p){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(p).classList.remove("hidden");document.querySelectorAll(".tab,nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p))}
$("itemSearch").oninput=renderItems;
$("histSearch").oninput=renderHistory;
$("refresh").onclick=renderAll;
$("csvBtn").onclick=()=>{
 const rows=stockMap(),csv=["Item,Godown,Stock KG",...rows.map(r=>`"${(r.item.itemName||"").replaceAll('"','""')}","${(r.godown.name||"").replaceAll('"','""')}",${r.qty}`)].join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="navkar-stock.csv";a.click();
};


</script>
